[package]
name = "selene_shell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Selene -- a QML shell for Hyprland, written in Rust"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_full"] }
hyprland = "0.4.0-beta.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "0.12", default-features = false, features = ["lua54"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
zbus = { version = "5.18.0", features = ["blocking"] }

[build-dependencies]
cxx-qt-build = "0.9"
qt-build-utils = "0.9"

[features]
link_qt_object_files = ["cxx-qt-build/link_qt_object_files"]
